<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">InTruth — realtime fact-checking workflow</title>
  <desc id="desc">A video is transcribed locally with Whisper, checked by Codex against web sources, and shown with evidence-backed verdicts beside the video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.52" stop-color="#0d1830"/>
      <stop offset="1" stop-color="#10172a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64d8ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31d49b"/>
      <stop offset="1" stop-color="#16a772"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="34" fill="url(#bg)"/>
  <circle cx="210" cy="80" r="135" fill="#3bc9ff" opacity="0.09" filter="url(#glow)"/>
  <circle cx="1390" cy="495" r="170" fill="#8b7cff" opacity="0.11" filter="url(#glow)"/>
  <path d="M0 450 C280 390 470 530 760 458 C1030 390 1220 440 1600 360 V560 H0Z" fill="#fff" opacity="0.022"/>

  <g transform="translate(72 54)">
    <rect width="54" height="54" rx="16" fill="url(#brand)"/>
    <path d="M16 28.5 24.5 37 39 18.5" fill="none" stroke="#07111f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="35" fill="#f6f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800">InTruth</text>
    <text x="223" y="35" fill="#8e9ab6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500">fact-checking mentre guardi il video</text>
  </g>

  <!-- Video card -->
  <g transform="translate(72 152)" filter="url(#shadow)">
    <rect width="430" height="326" rx="24" fill="#121f35" stroke="#263652"/>
    <rect x="18" y="18" width="394" height="216" rx="16" fill="#08101d"/>
    <rect x="34" y="34" width="140" height="16" rx="8" fill="#253956"/>
    <rect x="34" y="62" width="224" height="12" rx="6" fill="#1c2b42"/>
    <circle cx="215" cy="132" r="38" fill="#ffffff" opacity="0.12"/>
    <path d="M207 112 235 132 207 152Z" fill="#f6f8ff"/>
    <g transform="translate(34 188)">
      <rect width="324" height="5" rx="2.5" fill="#263652"/>
      <rect width="188" height="5" rx="2.5" fill="#64d8ff"/>
      <circle cx="188" cy="2.5" r="6" fill="#64d8ff"/>
    </g>
    <g transform="translate(28 252)">
      <rect width="374" height="56" rx="14" fill="#182843"/>
      <circle cx="28" cy="28" r="15" fill="#64d8ff" opacity="0.18"/>
      <path d="M22 30c4 4 8 4 12 0M28 18v16" fill="none" stroke="#64d8ff" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="25" fill="#eff4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Audio del video</text>
      <text x="56" y="44" fill="#8e9ab6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">YouTube / Jubilee</text>
      <rect x="276" y="14" width="82" height="28" rx="14" fill="#0f3c4d"/>
      <text x="317" y="33" text-anchor="middle" fill="#64d8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">LIVE</text>
    </g>
  </g>

  <!-- Pipeline -->
  <g transform="translate(555 175)">
    <line x1="0" y1="145" x2="354" y2="145" stroke="#314360" stroke-width="3" stroke-dasharray="7 10"/>
    <path d="M342 135 358 145 342 155Z" fill="#5f7291"/>

    <g transform="translate(0 54)">
      <rect width="170" height="178" rx="22" fill="#111d31" stroke="#2a3c5b"/>
      <circle cx="85" cy="54" r="30" fill="#64d8ff" opacity="0.13"/>
      <path d="M69 55c5-18 27-18 32 0M72 64h26M76 72h18" fill="none" stroke="#64d8ff" stroke-width="4" stroke-linecap="round"/>
      <text x="85" y="108" text-anchor="middle" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Whisper</text>
      <text x="85" y="132" text-anchor="middle" fill="#9aa7c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">trascrive nel browser</text>
      <rect x="42" y="148" width="86" height="22" rx="11" fill="#0e3141"/>
      <text x="85" y="163" text-anchor="middle" fill="#64d8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">LOCALE</text>
    </g>

    <g transform="translate(198 54)">
      <rect width="170" height="178" rx="22" fill="#111d31" stroke="#3a365f"/>
      <circle cx="85" cy="54" r="30" fill="#8b7cff" opacity="0.14"/>
      <path d="M69 54h32M85 38v32M74 43l22 22M96 43 74 65" fill="none" stroke="#a69aff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="85" y="108" text-anchor="middle" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Codex</text>
      <text x="85" y="132" text-anchor="middle" fill="#9aa7c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">analizza + cerca fonti</text>
      <rect x="34" y="148" width="102" height="22" rx="11" fill="#272241"/>
      <text x="85" y="163" text-anchor="middle" fill="#bcb4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">WEB SEARCH</text>
    </g>

    <text x="184" y="20" text-anchor="middle" fill="#7f8da9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">TRASCRIVI → VERIFICA</text>
  </g>

  <!-- Results card -->
  <g transform="translate(972 152)" filter="url(#shadow)">
    <rect width="556" height="326" rx="24" fill="#121f35" stroke="#263652"/>
    <g transform="translate(22 20)">
      <text x="0" y="25" fill="#f6f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Risultati accanto al video</text>
      <text x="0" y="47" fill="#8e9ab6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">verdetto, confidenza e link alle fonti</text>
    </g>

    <g transform="translate(22 84)">
      <rect width="512" height="92" rx="16" fill="#102a2a" stroke="#1f664f"/>
      <rect x="16" y="16" width="86" height="28" rx="14" fill="url(#ok)"/>
      <text x="59" y="35" text-anchor="middle" fill="#071b14" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900">VERO</text>
      <text x="116" y="34" fill="#dffaf0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">“La misura è entrata in vigore nel 2025”</text>
      <text x="16" y="66" fill="#8fd6ba" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">2 fonti concordanti</text>
      <g transform="translate(388 58)">
        <circle cx="8" cy="8" r="8" fill="#31d49b" opacity="0.22"/>
        <circle cx="31" cy="8" r="8" fill="#64d8ff" opacity="0.22"/>
        <circle cx="54" cy="8" r="8" fill="#8b7cff" opacity="0.22"/>
      </g>
    </g>

    <g transform="translate(22 190)">
      <rect width="512" height="92" rx="16" fill="#2a2113" stroke="#6e5320"/>
      <rect x="16" y="16" width="112" height="28" rx="14" fill="#f3b84b"/>
      <text x="72" y="35" text-anchor="middle" fill="#2b1c00" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900">FUORVIANTE</text>
      <text x="142" y="34" fill="#fff2d7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Contesto incompleto o dato parziale</text>
      <text x="16" y="66" fill="#d7b77a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">apri le fonti per verificare l’evidenza</text>
      <path d="M456 58h24m-12-12 12 12-12 12" fill="none" stroke="#f3b84b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(556 491)">
    <rect width="356" height="34" rx="17" fill="#0d1728" stroke="#263652"/>
    <text x="178" y="22" text-anchor="middle" fill="#9aa7c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Audio locale • ricerca web • fonti cliccabili</text>
  </g>
</svg>
