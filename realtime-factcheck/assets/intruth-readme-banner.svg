<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">InTruth — real-time fact-checking for video</title>
  <desc id="desc">A browser video is transcribed locally with Whisper while InTruth checks claims with Codex and web sources, showing verdicts and evidence beside the video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090f"/>
      <stop offset="0.48" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#101522"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(250 30) rotate(38) scale(760 520)">
      <stop stop-color="#52d7ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#52d7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1620 680) rotate(-135) scale(700 500)">
      <stop stop-color="#7d72ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7d72ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66dcff"/>
      <stop offset="1" stop-color="#8a78ff"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#090c12"/>
    </linearGradient>
    <linearGradient id="speaker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#283446"/>
      <stop offset="1" stop-color="#111821"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="browserClip">
      <rect x="0" y="0" width="1570" height="574" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1800" height="760" rx="32" fill="url(#bg)"/>
  <rect width="1800" height="760" rx="32" fill="url(#glowA)"/>
  <rect width="1800" height="760" rx="32" fill="url(#glowB)"/>

  <g transform="translate(115 64)">
    <rect width="52" height="52" rx="15" fill="url(#accent)"/>
    <path d="M15 28 23 36 38 17" fill="none" stroke="#071019" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="35" fill="#f6f7fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="800" letter-spacing="-0.7">InTruth</text>
    <text x="235" y="34" fill="#7d8797" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2.3">REAL-TIME FACT CHECKING</text>
  </g>
  <text x="1685" y="96" text-anchor="end" fill="#aab2bf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600">Guarda. Trascrivi. Verifica.</text>

  <rect x="126" y="166" width="1548" height="556" rx="30" fill="#000" opacity="0.38"/>
  <g transform="translate(115 148)">
    <rect width="1570" height="574" rx="26" fill="#0a0d12" stroke="#242a35" stroke-width="1.5"/>
    <g clip-path="url(#browserClip)">
      <rect width="1570" height="58" fill="#141922"/>
      <circle cx="27" cy="29" r="6.5" fill="#ff5f57"/>
      <circle cx="49" cy="29" r="6.5" fill="#febc2e"/>
      <circle cx="71" cy="29" r="6.5" fill="#28c840"/>
      <rect x="118" y="13" width="820" height="32" rx="16" fill="#0c1016" stroke="#252d3a"/>
      <circle cx="143" cy="29" r="7" fill="none" stroke="#667085" stroke-width="1.5"/>
      <path d="M148 34 153 39" stroke="#667085" stroke-width="1.5" stroke-linecap="round"/>
      <text x="164" y="34" fill="#7f8999" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">youtube.com/watch?v=…</text>
      <circle cx="1515" cy="29" r="15" fill="#232a36"/>
      <circle cx="1515" cy="25" r="4.5" fill="#8e98a8"/>
      <path d="M1507 35c2.5-6 13.5-6 16 0" fill="#8e98a8"/>

      <rect x="0" y="58" width="1144" height="516" fill="url(#video)"/>
      <rect x="0" y="58" width="1144" height="516" fill="#000" opacity="0.08"/>
      <circle cx="207" cy="164" r="220" fill="#33516d" opacity="0.14" filter="url(#soft)"/>
      <circle cx="864" cy="465" r="260" fill="#4e3c72" opacity="0.13" filter="url(#soft)"/>

      <g transform="translate(64 96)">
        <rect width="1010" height="398" rx="22" fill="#0f141b" stroke="#202733"/>
        <rect x="0" y="0" width="620" height="398" rx="22" fill="url(#speaker)"/>
        <rect x="620" y="0" width="390" height="398" fill="#11161f"/>

        <ellipse cx="305" cy="210" rx="185" ry="145" fill="#182431"/>
        <circle cx="305" cy="168" r="75" fill="#243444"/>
        <path d="M205 330c20-90 180-90 200 0" fill="#22313f"/>
        <path d="M256 166c18-34 81-34 99 0" fill="none" stroke="#2f4357" stroke-width="12" stroke-linecap="round"/>
        <rect x="36" y="32" width="110" height="28" rx="14" fill="#111821" opacity="0.82"/>
        <circle cx="55" cy="46" r="5" fill="#ff3b5c"/>
        <text x="69" y="51" fill="#dfe5ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">LIVE DEBATE</text>

        <rect x="74" y="310" width="472" height="52" rx="12" fill="#05070a" opacity="0.78"/>
        <text x="310" y="333" text-anchor="middle" fill="#f7f8fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650">“La misura è entrata in vigore nel 2025…”</text>
        <text x="310" y="352" text-anchor="middle" fill="#9ca6b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">trascrizione live</text>

        <text x="664" y="54" fill="#f1f3f6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="760">Dibattito pubblico</text>
        <text x="664" y="79" fill="#687386" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">streaming video</text>
        <rect x="664" y="112" width="286" height="7" rx="3.5" fill="#232b38"/>
        <rect x="664" y="132" width="236" height="7" rx="3.5" fill="#232b38"/>
        <rect x="664" y="152" width="258" height="7" rx="3.5" fill="#232b38"/>
        <rect x="664" y="206" width="292" height="1" fill="#242c38"/>
        <text x="664" y="247" fill="#8691a2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">AUDIO → WHISPER</text>
        <g transform="translate(664 267)">
          <rect width="248" height="52" rx="13" fill="#0d1e26" stroke="#1d3d49"/>
          <circle cx="28" cy="26" r="13" fill="#66dcff" opacity="0.14"/>
          <path d="M24 27c3 3 6 3 9 0M28.5 18v14" fill="none" stroke="#66dcff" stroke-width="2.2" stroke-linecap="round"/>
          <text x="51" y="22" fill="#e6f8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Trascrizione locale</text>
          <text x="51" y="39" fill="#67808c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">audio elaborato nel browser</text>
        </g>
      </g>

      <g transform="translate(1144 58)">
        <rect width="426" height="516" fill="#0f0f0f" opacity="0.95"/>
        <rect width="1" height="516" fill="#ffffff" opacity="0.08"/>
        <rect width="426" height="58" fill="#111111"/>
        <circle cx="24" cy="29" r="5" fill="#4ade80"/>
        <text x="39" y="34" fill="#eeeeee" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">InTruth · Fact-checking live</text>
        <rect x="328" y="17" width="58" height="24" rx="6" fill="none" stroke="#353535"/>
        <text x="357" y="33" text-anchor="middle" fill="#8b8b8b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600">ESPORTA</text>
        <text x="400" y="35" text-anchor="middle" fill="#5a5a5a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">×</text>

        <text x="18" y="86" fill="#565656" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.3">TRASCRIZIONE</text>
        <text x="18" y="113" fill="#9a9a9a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">…la misura è entrata in vigore nel 2025 e</text>
        <text x="18" y="134" fill="#9a9a9a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">ha già prodotto effetti su tutto il territorio.</text>
        <text x="18" y="155" fill="#555" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-style="italic">analisi in corso…</text>
        <line x1="18" y1="176" x2="408" y2="176" stroke="#ffffff" stroke-opacity="0.065"/>

        <text x="18" y="202" fill="#565656" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.3">AFFERMAZIONI</text>
        <circle cx="24" cy="229" r="2.3" fill="#8f8f8f"/>
        <text x="35" y="234" fill="#b7b7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">Entrata in vigore nel 2025</text>
        <circle cx="24" cy="255" r="2.3" fill="#8f8f8f"/>
        <text x="35" y="260" fill="#b7b7b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">Applicazione su tutto il territorio</text>
        <line x1="18" y1="282" x2="408" y2="282" stroke="#ffffff" stroke-opacity="0.065"/>

        <text x="18" y="308" fill="#565656" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.3">VERIFICHE</text>

        <g transform="translate(18 326)">
          <rect width="390" height="78" rx="12" fill="#111815" stroke="#244434"/>
          <rect x="13" y="13" width="58" height="22" rx="11" fill="#1f5f3c"/>
          <text x="42" y="28" text-anchor="middle" fill="#98f2bb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900">VERO</text>
          <text x="83" y="28" fill="#e2e6e3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700">Entrata in vigore nel 2025</text>
          <text x="13" y="54" fill="#79867e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Confermato da 3 fonti indipendenti</text>
          <text x="342" y="56" fill="#63d893" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">92%</text>
        </g>

        <g transform="translate(18 416)">
          <rect width="390" height="78" rx="12" fill="#191611" stroke="#4b3d22"/>
          <rect x="13" y="13" width="92" height="22" rx="11" fill="#6b4c13"/>
          <text x="59" y="28" text-anchor="middle" fill="#ffd27b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="900">FUORVIANTE</text>
          <text x="118" y="28" fill="#ece8df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700">Copertura nazionale</text>
          <text x="13" y="54" fill="#948771" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Il contesto cambia la conclusione</text>
          <text x="342" y="56" fill="#e8b75d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">78%</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(118 706)">
    <rect width="148" height="34" rx="17" fill="#0d1d25" stroke="#193846"/>
    <circle cx="20" cy="17" r="5" fill="#66dcff"/>
    <text x="34" y="22" fill="#bfefff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Whisper locale</text>
    <text x="170" y="22" fill="#586474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">→</text>
    <rect x="198" width="170" height="34" rx="17" fill="#17152a" stroke="#302d55"/>
    <circle cx="218" cy="17" r="5" fill="#8a78ff"/>
    <text x="232" y="22" fill="#d5ceff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Codex + ricerca web</text>
    <text x="392" y="22" fill="#586474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">→</text>
    <rect x="420" width="172" height="34" rx="17" fill="#101c16" stroke="#264633"/>
    <circle cx="440" cy="17" r="5" fill="#4ade80"/>
    <text x="454" y="22" fill="#c2f4d3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Verdetti con fonti</text>
  </g>
</svg>
