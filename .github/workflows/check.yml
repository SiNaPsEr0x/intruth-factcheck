name: Check InTruth Codex
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm run versions
      - if: matrix.node == 26
        run: npm run vendor && git diff --exit-code -- realtime-factcheck/src/vendor realtime-factcheck/licenses
      - run: npm test
      - run: npm run lint
      - run: npm run package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: intruth-codex-node-${{ matrix.node }}
          path: dist/*.zip
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          check-latest: true
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:native
