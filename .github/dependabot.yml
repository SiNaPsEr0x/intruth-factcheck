version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '05:20'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      onnx-runtime:
        patterns: ['onnxruntime-*']
    commit-message:
      prefix: 'fix(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:40'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
